[General]
loglevel = notify
ipv6 = false
test-timeout = 5
internet-test-url = http://connectivitycheck.platform.hicloud.com/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
exclude-simple-hostnames = true
read-etc-hosts = true

# Bootstrap only: encrypted DNS handles ordinary domain lookups.
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query
# Intercepts traditional DNS on port 53 when Surge VIF / Enhanced Mode is active.
hijack-dns = *:53

# Reject UDP when the selected proxy cannot relay it, rather than silently going direct.
udp-policy-not-supported-behaviour = reject

