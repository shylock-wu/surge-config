# Replace this example.invalid URL with your own Surge-compatible subscription URL.
🚀 我的节点 = select, policy-path=https://example.invalid/REPLACE_WITH_YOUR_SUBSCRIPTION_URL, update-interval=0

🇭🇰 香港节点 = smart, include-other-group=🚀 我的节点, policy-regex-filter=(🇭🇰)|(香港)|(Hong)|(HK), hidden=1
